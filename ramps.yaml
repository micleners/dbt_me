# Entry ramps — how you actually arrive at the web.
# Each ramp matches an opening ("what's going on") and points into the graph.
# The crawler picks a ramp, then follows the pages' own typed edges from there.
#
# kind: felt-state | situation | goal
# edges[].to is a page id; primary=true marks the first suggestion to surface.

ramps:
  # ---------- FELT STATES ----------
  - id: ramp/panicking
    kind: felt-state
    cue: "Panicking — racing heart, flushed, physically activated, can't think."
    edges:
      - to: distress-tolerance/tipp
        primary: true
        note: Extreme bodily arousal calls for the fastest body-based down-regulation.
      - to: distress-tolerance/grounding
        note: If it's more spiral than alarm, reorient to the present instead.
      - to: distress-tolerance/half-smile
        note: A gentler body signal if TIPP is too much or unavailable.

  - id: ramp/numb-empty
    kind: felt-state
    cue: "Numb, empty, flat, depressed, unmotivated."
    edges:
      - to: distress-tolerance/tipp
        primary: true
        note: Use the warmth/intense-exercise side of TIPP to lift a low state.
      - to: distress-tolerance/self-soothing
        note: Gentle sensory comfort to re-engage.
      - to: distress-tolerance/actions-based-on-values
        note: When steadier, small value-aligned action breaks the avoidance cycle.

  - id: ramp/urge-to-act
    kind: felt-state
    cue: "Overwhelmed and about to act on an urge (lash out, binge, drink, self-harm, text someone)."
    edges:
      - to: distress-tolerance/urge-surfing
        primary: true
        note: Ride the urge out — it peaks and fades if you don't act.
      - to: distress-tolerance/resistt
        note: If staying with it is too much, manage the urge with the RESISTT menu.
      - to: distress-tolerance/accepts
        note: Or distract through the moment with ACCEPTS.

  - id: ramp/resentful-stuck
    kind: felt-state
    cue: "Resentful, fighting reality, stuck on how unfair something is."
    edges:
      - to: distress-tolerance/radical-acceptance
        primary: true
        note: Stop paying the resistance tax on something already fixed.
      - to: distress-tolerance/willingness-vs-willfulness
        note: Notice the willful stance and shift to a willing one.

  # ---------- SITUATIONS ----------
  - id: ramp/interpersonal-conflict
    kind: situation
    cue: "In conflict with a person, about to say something I'll regret."
    edges:
      - to: distress-tolerance/recognize-emotional-crisis
        primary: true
        note: Gateway — confirm the warning signs, which then branch by what you're feeling.
      - to: distress-tolerance/tipp
        note: If your body is already in alarm, down-regulate before you speak.
      - to: interpersonal-effectiveness/give
        note: Once calmer, say what you need with GIVE so the relationship survives the conversation.

  - id: ramp/harmful-behavior-urge
    kind: situation
    cue: "Urge to do a specific harmful behavior (drink, binge, self-harm, contact an ex)."
    edges:
      - to: distress-tolerance/urge-surfing
        primary: true
        note: Sit with the wave instead of obeying it.
      - to: distress-tolerance/cost-benefit-analysis
        note: Later, when calm, weigh whether the behavior is worth changing at all.

  - id: ramp/ruminating
    kind: situation
    cue: "Ruminating, pulled out of the present into past or future thoughts."
    edges:
      - to: distress-tolerance/grounding
        primary: true
        note: Return to the present through the senses.

  # ---------- GOALS ----------
  - id: ramp/get-through-moment
    kind: goal
    cue: "I just want to get through this moment without making it worse."
    edges:
      - to: distress-tolerance/accepts
        primary: true
        note: Pick one distraction category and survive the moment.
      - to: distress-tolerance/tipp
        note: If the body is in alarm, reset it fast.
      - to: distress-tolerance/self-soothing
        note: If you have a little space, comfort the senses.

  - id: ramp/accept-unchangeable
    kind: goal
    cue: "I want to accept something I can't change."
    edges:
      - to: distress-tolerance/radical-acceptance
        primary: true
        note: The core acceptance skill.
      - to: distress-tolerance/willingness-vs-willfulness
        note: The stance that makes acceptance actionable.

  - id: ramp/decide-habit-change
    kind: goal
    cue: "I want to decide whether to change a habit or behavior."
    edges:
      - to: distress-tolerance/cost-benefit-analysis
        primary: true
        note: Score the costs and benefits to build the motivation.

  - id: ramp/fewer-crises
    kind: goal
    cue: "I want to build a life with fewer crises."
    edges:
      - to: distress-tolerance/actions-based-on-values
        primary: true
        note: Purpose and value-aligned action buffer against future distress.
      - to: distress-tolerance/recognize-emotional-crisis
        note: Learn your early-warning pattern so you can act sooner next time.

  # ---------- MINDFULNESS ----------
  - id: ramp/caught-in-thoughts
    kind: felt-state
    cue: "Caught in a churn of thoughts, believing them, can't get any distance."
    edges:
      - to: mindfulness/mental-noting
        primary: true
        note: Label each thought plainly so it stops sweeping you along.
      - to: mindfulness/thought-defusion
        note: If a thought won't loosen, use imagery to put space between you and it.

  - id: ramp/self-critical
    kind: felt-state
    cue: "Harsh and judgmental toward myself or others, and it's souring my mood."
    edges:
      - to: mindfulness/mindfulness-of-negative-judgments
        primary: true
        note: First catch the automatic judgments and the feelings they produce.
      - to: mindfulness/letting-go
        note: Then rewrite them into non-judgmental observations to drain the charge.

  - id: ramp/cant-name-feeling
    kind: felt-state
    cue: "Uneasy or overwhelmed but I can't tell what I'm actually feeling."
    edges:
      - to: mindfulness/describe-your-emotions
        primary: true
        note: Name it, rate it, and separate the emotion from the thoughts it drives.
      - to: mindfulness/internal-vs-external-events
        note: If you're tuned out of your inner world, rebalance toward internal awareness.

  # ---------- SITUATIONS (mindfulness) ----------
  - id: ramp/torn-decision
    kind: situation
    cue: "Facing a decision and torn between what I feel and what's logical."
    edges:
      - to: mindfulness/wise-mind
        primary: true
        note: Integrate emotion and fact instead of deciding from just one.

  # ---------- GOALS (mindfulness) ----------
  - id: ramp/build-mindfulness
    kind: goal
    cue: "I want to build a mindfulness practice from the ground up."
    edges:
      - to: mindfulness/observing
        primary: true
        note: Start with the foundational skill — observe one object, notice drift, return.
      - to: mindfulness/mental-body-scan
        note: Extend the same attention to the body to relax and reconnect.
      - to: mindfulness/mindful-breathing
        note: A portable anchor you can practice anywhere.

  - id: ramp/calm-anxious-mind
    kind: goal
    cue: "I want to calm an anxious, racing mind."
    edges:
      - to: mindfulness/mindful-breathing
        primary: true
        note: Anchor on the breath to settle the nervous system.
      - to: mindfulness/thought-defusion
        note: If anxious thoughts keep gripping, create distance from them.
      - to: mindfulness/mental-body-scan
        note: Release the physical tension anxiety leaves in the body.

  # ---------- INTERPERSONAL EFFECTIVENESS ----------
  - id: ramp/swallowing-needs
    kind: felt-state
    cue: "Resentful because I keep saying yes, apologizing, or staying quiet about what I need."
    edges:
      - to: interpersonal-effectiveness/fast
        primary: true
        note: Stop trading self-respect for peace; no apologies for having needs.
      - to: interpersonal-effectiveness/communication-styles
        note: See whether a passive or passive-aggressive pattern is running the show.

  - id: ramp/dreading-conversation
    kind: felt-state
    cue: "Dreading a conversation I need to have; I keep putting it off."
    edges:
      - to: interpersonal-effectiveness/barriers-to-interpersonal-effectiveness
        primary: true
        note: Find what's in the way (old patterns, fear, unclear needs, flooding).
      - to: interpersonal-effectiveness/dear-man
        note: Then script the conversation so you know what you'll say.

  - id: ramp/pushback
    kind: situation
    cue: "I made my case and they keep arguing, deflecting, or criticizing."
    edges:
      - to: interpersonal-effectiveness/resistance-and-conflict
        primary: true
        note: Validate their view, repeat your point, ask for specifics.
      - to: interpersonal-effectiveness/give
        note: If the relationship matters more than the point, soften the delivery.

  - id: ramp/ask-for-something
    kind: goal
    cue: "I want to ask someone for something and actually get heard."
    edges:
      - to: interpersonal-effectiveness/dear-man
        primary: true
        note: Describe, Express, Assert, Reinforce; stay Mindful, Appear confident, Negotiate.
      - to: interpersonal-effectiveness/modulating-intensity
        note: Decide first how hard to press, given urgency and their vulnerability.
      - to: interpersonal-effectiveness/skills-of-assertiveness
        note: If you're not sure what you want yet, start with your priorities.

  - id: ramp/say-no
    kind: goal
    cue: "I want to say no or set a boundary without caving or feeling guilty."
    edges:
      - to: interpersonal-effectiveness/fast
        primary: true
        note: Hold the line with your values and without apologizing.
      - to: interpersonal-effectiveness/interpersonal-boundaries
        note: Get clear on which boundary it is and how open to be.
      - to: interpersonal-effectiveness/skills-of-assertiveness-part-2
        note: Decline assertively so the relationship stays intact.

  - id: ramp/keep-relationship
    kind: goal
    cue: "I need to raise a problem with someone I care about without damaging things."
    edges:
      - to: interpersonal-effectiveness/give
        primary: true
        note: Gentle, Interested, Validate, Easy manner.
      - to: interpersonal-effectiveness/listening-and-validation
        note: Make sure they feel heard before you ask to be heard.

  - id: ramp/rebuild-trust
    kind: goal
    cue: "I want relationships I can trust, or to be more trustworthy myself."
    edges:
      - to: interpersonal-effectiveness/trust-in-relationships
        primary: true
        note: Honesty, understanding and respect, consistency.
      - to: interpersonal-effectiveness/interpersonal-boundaries
        note: Open up at the pace the other person does.

  # ---------- EMOTION REGULATION ----------
  - id: ramp/about-to-react
    kind: situation
    cue: "Something just set me off and I'm about to say or do something on impulse."
    edges:
      - to: emotion-regulation/stop
        primary: true
        note: Freeze, step back, observe, then choose.
      - to: distress-tolerance/tipp
        note: If breathing isn't enough to bring your body down, reset it physically.

  - id: ramp/recurring-trigger
    kind: situation
    cue: "The same kind of situation keeps setting me off."
    edges:
      - to: emotion-regulation/problem-solving
        primary: true
        note: Analyze the trigger, pick what you can change, plan an alternative.
      - to: emotion-regulation/recognizing-your-emotions
        note: First map the chain from trigger to emotion, urge, action, and outcome.
      - to: emotion-regulation/coping-ahead
        note: Then rehearse the new response before it comes up again.

  - id: ramp/avoiding-hiding
    kind: felt-state
    cue: "Anxious, ashamed, or low, and the urge is to avoid, hide, or isolate."
    edges:
      - to: emotion-regulation/balancing-emotional-urges
        primary: true
        note: If the urge won't help, do the opposite of what it says.
      - to: emotion-regulation/emotion-exposure
        note: If the emotion keeps returning, practice sitting with it instead of escaping.

  - id: ramp/judging-my-feelings
    kind: felt-state
    cue: "Beating myself up for feeling this way; I shouldn't feel like this."
    edges:
      - to: emotion-regulation/self-validation
        primary: true
        note: Acknowledge, allow, understand; stop adding feelings about the feeling.
      - to: emotion-regulation/myths-emotions
        note: Check which beliefs about emotions are fueling the judgment.

  - id: ramp/run-down
    kind: felt-state
    cue: "Run down, tired, or unwell, and every little thing sets me off."
    edges:
      - to: emotion-regulation/abc-please
        primary: true
        note: Shore up the basics (sleep, food, exercise, illness, substances, positives).
      - to: emotion-regulation/emotions-physical-vulnerability
        note: The fuller plan for diet, sleep, exercise, and stressors.

  - id: ramp/distorted-thoughts
    kind: felt-state
    cue: "My thoughts are spiraling: always, never, everyone hates me, worst case."
    edges:
      - to: emotion-regulation/emotions-cognitive-vulnerability
        primary: true
        note: Name the distortion and write a rational response.
      - to: mindfulness/thought-defusion
        note: If arguing with the thought doesn't work, step back from it instead.

  - id: ramp/cant-get-going
    kind: goal
    cue: "I'm too low to get anything done and things are piling up."
    edges:
      - to: emotion-regulation/being-effective
        primary: true
        note: Break the next task into the smallest concrete step and do it.
      - to: emotion-regulation/abc-please
        note: Accumulate small positives and build mastery to lift the baseline.

  - id: ramp/prepare-for-hard-event
    kind: goal
    cue: "I have something stressful coming up and want to be ready for it."
    edges:
      - to: emotion-regulation/coping-ahead
        primary: true
        note: Describe it, choose a skill, and rehearse it until you feel prepared.
